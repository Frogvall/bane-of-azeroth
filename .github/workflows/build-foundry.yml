name: Build Foundry module

on:
  workflow_dispatch:

  push:
    branches:
      - foundry
      - main
    paths:
      - "foundry/**"
      - "tools/package-foundry.sh"
      - ".github/workflows/build-foundry.yml"

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build Foundry package
    runs-on: ubuntu-24.04

    container:
      image: ghcr.io/frogvall/bane-of-azeroth-fvtt-cli:3.0.4-${{ github.ref_name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Foundry module
        run: tools/package-foundry.sh

      - name: Read package metadata
        id: package
        run: |
          module_id="$(jq -r '.id' foundry/module.json)"
          version="$(jq -r '.version' foundry/module.json)"
          filename="${module_id}-${version}.zip"

          echo "filename=${filename}" >> "$GITHUB_OUTPUT"
          echo "path=dist/${filename}" >> "$GITHUB_OUTPUT"

      - name: Upload Foundry module
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          archive: false

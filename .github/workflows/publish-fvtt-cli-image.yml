name: Publish Foundry CLI image

on:
  workflow_dispatch:

  push:
    branches:
      - foundry
    paths:
      - tools/foundryvtt-cli/Dockerfile
      - .github/workflows/publish-fvtt-cli-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/frogvall/bane-of-azeroth-fvtt-cli
  IMAGE_VERSION: "3.0.4"

jobs:
  publish:
    name: Build and publish CI image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: tools/foundryvtt-cli
          target: ci
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
